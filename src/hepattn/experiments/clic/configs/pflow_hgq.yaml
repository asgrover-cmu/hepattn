# GENERATED from base.yaml for the Keras/HGQ2 path (see docs/hgq/USAGE.md).
# Differences from base.yaml: KerasMaskFormer model, torch-SDPA attention semantics,
# fp32 precision, single device, no Compile callback, EBOPs monitoring, HGQ2 quantization + beta schedule.
# Run with: python -m hepattn.experiments.clic.main_hgq fit --config <this file>
#
# Matched to Helen's config: linformer attention (encoder + decoder), batch_size 128,
# bf16-mixed precision, AdamW, LR max 5e-5, 50 epochs, grad-clip norm.
# Linformer here is our quantized KerasLinformerAttention (a QAT port of Helen's custom
# backend). NOTE: at CLIC's N~168 the low-rank projection (k=256) gives NO sequence
# compression (k > N); the batch-128 throughput win comes from bf16-mixed, validated
# finite+grad-flowing against the HGQ2 quantizers (job 26777). k=256 is Helen's value and
# is required by the projected-space masking (k >= kv_len).
name: CLIC_pflow_HGQ
seed_everything: 42
data:
  inputs:
    hit:
    - x
    - y
    - z
    - r
    - s
    - theta
    - phi
  targets:
    particle:
    - e
    - pt
    - eta
    - sinphi
    - cosphi
  num_objects: 150
  train_path: /projects/u5ar/data/clic/train_clic_fix.root
  valid_path: /projects/u5ar/data/clic/val_clic_fix.root
  test_path: /projects/u5ar/data/clic/test_clic_common_infer.root
  num_workers: 16
  num_train: -1
  num_test: -1
  num_val: 5000
  batch_size: 128  # matched to Helen (enabled by bf16-mixed; needs full A100 / heavy QOS)
  incidence_cutval: 0.01
  scale_dict_path: configs/clic_var_transform.yaml
trainer:
  max_epochs: 50  # matched to Helen
  accelerator: gpu
  devices: 1
  precision: bf16-mixed  # matched to Helen (validated finite+grad-flowing vs HGQ2, job 26777)
  gradient_clip_val: 0.1
  gradient_clip_algorithm: norm  # matched to Helen
  log_every_n_steps: 1000  # matched to Helen
  default_root_dir: logs
  enable_progress_bar: true
  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: hepattn-clic
  callbacks:
  - class_path: hepattn.callbacks.InferenceTimer
  - class_path: hepattn.callbacks.SaveConfig
  - class_path: hepattn.callbacks.Checkpoint
    init_args:
      monitor: val/loss
      save_last: true
  - class_path: hepattn.experiments.clic.PflowPredictionWriter
  - class_path: lightning.pytorch.callbacks.ModelSummary
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
  - class_path: lightning.pytorch.callbacks.TQDMProgressBar
    init_args:
      refresh_rate: 50
  - class_path: hepattn.keras.callbacks.EBOPsMonitor
  # Closed-loop control of beta against a fixed EBOPs setpoint, following
  # Laatu, Sun et al. (arXiv:2510.24784). Replaces BetaScheduler -- the two cannot
  # coexist (BetaScheduler writes _beta every batch and would erase the controller;
  # BetaPID.setup raises if both are registered).
  - class_path: hepattn.keras.callbacks.BetaPID
    init_args:
      # Measured total is 1.6755e15; this asks for a 40% cut. NOT the hardware budget
      # (an XCVU13P holds ~2.15e6 EBOPs) -- a setpoint that far off saturates the
      # controller immediately and is indistinguishable from training at max_beta.
      target_ebops: 1.0e+15  # YAML 1.1 needs the exponent sign, else this is a str
      init_beta: 2.6e-10
      i: 0.5
      warmup_epochs: 2
      max_beta: 1.0e-7
model:
  optimizer: AdamW  # matched to Helen (was Lion)
  lrs_config:
    initial: 1e-6
    max: 5e-5  # matched to Helen (was 8e-5)
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-4
    skip_scheduler: false
  mtl: false
  # Compile HGQ2's training-mode quantizer functions (needs the pinned HGQ2 build, and the
  # launcher must NOT set TORCHDYNAMO_DISABLE). Same numerics as eager; ~1.65x step rate.
  hgq_train_compile: false
  model:
    class_path: hepattn.keras.maskformer.KerasMaskFormer
    init_args:
      dim: 256
      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.InputNet
            init_args:
              input_name: node
              fields:
              - features
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 27
                  output_size: 256
              posenc:
                class_path: hepattn.models.posenc.FourierPositionEncoder
                init_args:
                  input_name: node
                  dim: 256
                  fields:
                  - eta
                  - phi
                  scale: 0.1
      encoder:
        num_layers: 6
        attn_type: linformer  # matched to Helen (KerasLinformerAttention; k=256 >= N=168)
        hybrid_norm: true
        value_residual: true
        num_register_tokens: 8
        attn_kwargs:
          num_heads: 16
          linformer_seq_len: 256
          linformer_proj_dim: 256
      decoder:
        num_decoder_layers: 4
        num_queries: 150
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: 256
          hybrid_norm: true
          attn_kwargs:
            num_heads: 16
            attn_type: linformer  # matched to Helen (encoder + decoder linformer)
            linformer_seq_len: 256
            linformer_proj_dim: 256
      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true
          n_jobs: 16
      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
          - class_path: hepattn.models.task.ObjectClassificationTask
            init_args:
              name: classification
              input_object: query
              output_object: pflow
              target_object: particle
              num_classes: 5
              losses:
                object_ce: 2
              costs:
                object_ce: 2
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 256
                  activation: torch.nn.SiLU
                  output_size: 6
                  hidden_layers:
                  - 256
                  - 128
                  - 32
              null_weight: 0.5
              class_weights:
              - 1.0
              - 3.0
              - 8.0
              - 1.5
              - 1.0
              mask_queries: false
              has_intermediate_loss: true
          - class_path: hepattn.models.task.ObjectHitMaskTask
            init_args:
              name: mask
              input_constituent: node
              input_object: query
              output_object: pflow
              target_object: particle
              pred_threshold: 0.1
              logit_scale: 4
              losses:
                mask_bce: 5.0
                mask_dice: 1.0
              costs:
                mask_dice: 1.0
              dim: 256
              null_weight: 1.0
              has_intermediate_loss: true
          - class_path: hepattn.models.task.IncidenceRegressionTask
            init_args:
              name: incidence
              input_constituent: node
              input_object: query
              output_object: pflow
              target_object: particle
              losses:
                kl_div: 1.0
              costs:
                kl_div: 1.0
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 256
                  activation: torch.nn.SiLU
                  hidden_layers: 2
              node_net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 256
                  hidden_layers: 1
              has_intermediate_loss: false
          - class_path: hepattn.models.task.IncidenceBasedRegressionTask
            init_args:
              name: regression
              fields:
              - e
              - pt
              - eta
              - sinphi
              - cosphi
              input_constituent: node
              input_object: query
              output_object: pflow
              target_object: particle
              loss: l1
              loss_weight: 10.0
              cost_weight: 10.0
              use_incidence: true
              use_nodes: true
              cost: new
              mode: scale
              scale_dict_path: configs/clic_var_transform.yaml
              net:
                class_path: hepattn.models.Dense
                init_args:
                  input_size: 518
                  activation: torch.nn.SiLU
                  output_size: 5
                  hidden_layers:
                  - 512
                  - 256
                  - 128
                  - 64
                  - 32
              has_intermediate_loss: false
      quant:
        weight:
          default_q_type: kbi
          b0: 8
          i0: 2
        datalane:
          default_q_type: kif
          i0: 4
          f0: 8
        table:
          default_q_type: kif
          i0: 2
          f0: 10
        ebops:
          # beta must be tuned per model so beta*EBOPs is comparable to the task loss
          # (monitor train/quant_ebops_loss vs train/loss); the scheduler ramps it in
          beta0: 1.0e-12
