[project]
authors = [{name = "Sam Van Stroud", email = "sam.van.stroud@cern.ch"}]
description = "Attention for High Energy Physics"
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
name = "hepattn"
requires-python = "== 3.12"
version = "0.2.0"

dependencies = [
    "packaging>=24.1,<27",
    "jupyter>=1.1.1,<2",
    "ipykernel>=6.30.1,<7",
    "wheel>=0.45.1,<0.46",
    "numpy>=2.1.2,<3",
    "scipy>=1.16.2,<2",
    "pytest>=8.4.2,<9",
    "pytest-repeat>=0.9.4,<0.10",
    "pytest-cov>=7.0.0,<8",
    "coverage[toml]>=7.10.6,<8",
    "ruff==0.13.0",
    "pre-commit>=4.3.0,<5",
    "matplotlib>=3.10.6,<4",
    "lightning==2.5.2",
    "comet-ml==3.50.0",
    "pandas>=2.3.2,<4",
    "pyarrow>=21.0.0,<24",
    "jsonargparse[signatures]==4.40.1",
    "torchjd>=0.7.0,<0.8",
    "lion-pytorch>=0.2.3,<0.3",
    "awkward>=2.8.8,<3",
    "uproot>=5.6.5,<6",
    "h5py>=3.14.0,<4",
    "particle>=0.25.4,<0.26",
    "scikit-learn>=1.7.2,<2",
    "onnx>=1.19.0,<2",
    "onnxruntime>=1.22.1,<2",
    "einops>=0.8.1,<0.9",
    "atlas-ftag-tools>=0.2.9,<0.3",
    "ty>=0.0.1a20,<0.0.1a21",
    "lapx>=0.9.2,<0.10",
]

[dependency-groups]
clic = ["pathos", "vector", "fastjet", "energyflow"] # has problems on isambard
tide = ["numba>=0.61.2"] # has problems on isambard
hgq = [
    "keras>=3.8,<4",
    # HGQ2 0.1.9 + 5 training-throughput commits (branch perf/train-compile of helenllii/HGQ2):
    # numerically identical to 0.1.9, adds set_train_compile() used by MPflowHGQ(hgq_train_compile=True)
    "hgq2 @ git+https://github.com/helenllii/HGQ2.git@4235490f6f01cbbddc627a57b4b29c8e9ab1c91e",
    "hls4ml>=1.2.0,<2",
    # no linux-aarch64 wheels; only needed for the hls4ml/FPGA conversion step
    "da4ml>=0.6; platform_machine != 'aarch64'",
]
fa2 = ["flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.4.17/flash_attn-2.8.3%2Bcu128torch2.9-cp312-cp312-linux_x86_64.whl"]

[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/hepattn", "src/lap1015/src/lap1015"]


[tool.pixi.workspace]
channels = ["conda-forge", "nvidia", "nodefaults"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.pypi-dependencies]
hepattn = { path = ".", editable = true }
datasets = ">=4.4.1,<5"
fsspec = { version = ">=2025.10.0,<2027", extras = ["http"] }

[tool.pixi.pypi-options]
no-build-isolation = ["flash-attn"]
# extra-index-urls = ["https://download.pytorch.org/whl/cu128"]

[tool.pixi.feature.gpu.pypi-dependencies]
torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cu128"}

[tool.pixi.feature.cpu.pypi-dependencies]
torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cpu" }

# da4ml ships no linux-aarch64 wheels and pixi solves dependency groups for every
# workspace platform regardless of PEP 508 markers, so the hgq feature (and any
# environment including it) is limited to linux-64
[tool.pixi.feature.hgq]
platforms = ["linux-64"]

[tool.pixi.environments]
default = { features = ["gpu", "fa2"] }
isambard = { features = ["gpu"] }
cpu = { features = ["cpu"] }
clic = { features = ["clic"] }
tide = { features = ["tide"] }
hgq = { features = ["cpu", "hgq"] }
# NOTE: pixi.lock must be regenerated on linux after manifest changes —
# cross-locking from macOS fails because the editable hepattn build and some
# group sdists cannot be built for foreign platforms.
ci = { features = ["cpu", "clic", "tide", "hgq"]}

[tool.pixi.system-requirements]
libc = "2.28"
cuda = "12.3"

[tool.pixi.dependencies]
gxx = ">=14.3.0,<14.4"
git = ">=2.51.0,<3"
git-lfs = ">=3.7.0,<4"
ninja = ">=1.13.1,<2"
cuda = "12.8.*"

[tool.pixi.tasks.test]
cmd = "pytest"

[tool.pixi.tasks.test-ci]
cmd = "pytest -m 'not gpu and not requiresdata' --cov=src --cov-report=xml --cov-report=term-missing"

[tool.pixi.tasks.test-unit-ci]
cmd = "pytest --ignore=tests/experiments/ -m 'not gpu and not requiresdata' --cov=src --cov-report=xml --cov-report=term-missing"

[tool.pixi.tasks.test-integration-ci]
cmd = "pytest tests/experiments/ -m 'not gpu and not requiresdata' --cov=src --cov-report=xml --cov-report=term-missing"


[tool.ruff]
src = ["src"]
line-length = 150
preview = true
#format.skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["G", "D100", "D101", "D102", "D103",  "D104", "D105", "D106", "D107", "D205", "ANN", "PLW", "FBT", "EM",  "PLR2004", "PT018", "COM812", "CPY001", "TRY003", "S101", "N812", "PLR0913", "PLR0917", "DOC201", "INP001", "PLR6301", "T201", "TD002", "TD003", "FIX002", "ARG002", "C901", "PLR0914", "PLR0912", "PLR0915", "PT011", "ERA001", "PGH004", "PLC0206", "S311", "PLR0911", "PLR6104", "S404", "S603", "B028", "PLR1702", "N806", "N806"]
#isort.split-on-trailing-comma=false
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.ty.rules]
missing-argument = "ignore" # for now as kwarg unpacking is not supported


[tool.pytest.ini_options]
filterwarnings = ["ignore:.*distutils Version classes are deprecated. Use packaging.version instead.*:DeprecationWarning"]
markers = ["gpu: mark test to run on GPU", "requiresdata: mark test that requires data not present in the repository"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/lap1015/*",
    "*/experiments/*",
    "*.ipynb"
]

[tool.coverage.report]
exclude_lines = [
    "raise AssertionError",
    "raise NotImplementedError",
    "raise ValueError",
]
